<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>To-doist</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- No start_url in the manifest on purpose: the home-screen icon keeps the phone link it was added from. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1915" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="To-doist">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">✓</span>
        <span class="brand-name">To-doist</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="save-status" id="save-status" title="All changes are saved to data/data.json">
        <span class="dot"></span><span class="label">Saved</span>
      </div>
    </aside>
    <main class="main" id="main">
      <div class="loading">Loading…</div>
    </main>
  </div>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
